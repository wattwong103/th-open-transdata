<script>
/* ============================================================
   Design System — inlined component bundle
   Namespace: window.DS
   ============================================================ */
(function() {
  const { createElement: h, useState, useEffect } = React;

  /* --- Avatar --- */
  function Avatar({ src, name, size = 80, shape = "circle", style: extraStyle }) {
    const radius = shape === "rounded" ? "var(--radius-md)" : "50%";
    const s = {
      width: size, height: size,
      borderRadius: radius,
      objectFit: "cover",
      border: "1px solid var(--border-subtle)",
      display: "block",
      ...extraStyle,
    };
    return h("img", { src, alt: name, style: s });
  }

  /* --- Eyebrow --- */
  function Eyebrow({ children }) {
    return h("p", {
      style: {
        fontFamily: "var(--font-mono)",
        fontSize: "var(--text-xs)",
        letterSpacing: "var(--tracking-caps)",
        textTransform: "uppercase",
        color: "var(--accent)",
        margin: "0 0 var(--space-2)",
      }
    }, children);
  }

  /* --- Badge --- */
  function Badge({ children, variant = "default" }) {
    const variants = {
      default: { background: "var(--surface-raised)", color: "var(--text-muted)", border: "1px solid var(--border-subtle)" },
      accent:  { background: "var(--surface-tint)",   color: "var(--accent)",      border: "1px solid var(--border-subtle)" },
      coral:   { background: "rgba(224,83,61,0.12)",  color: "var(--status-highlight)", border: "1px solid rgba(224,83,61,0.25)" },
    };
    return h("span", {
      style: {
        display: "inline-flex",
        alignItems: "center",
        fontFamily: "var(--font-mono)",
        fontSize: "var(--text-xs)",
        fontWeight: "var(--weight-medium)",
        padding: "2px 8px",
        borderRadius: "var(--radius-xs)",
        ...variants[variant] || variants.default,
      }
    }, children);
  }

  /* --- Card --- */
  function Card({ children, interactive, padding = "var(--space-4)", style: extraStyle, onClick }) {
    const [hovered, setHovered] = useState(false);
    const base = {
      background: "var(--surface-card)",
      border: "1px solid var(--border-subtle)",
      borderRadius: "var(--radius-md)",
      boxShadow: hovered && interactive ? "var(--shadow-md)" : "var(--shadow-xs)",
      padding,
      transition: "box-shadow var(--duration-base) var(--ease-standard), border-color var(--duration-base) var(--ease-standard), transform var(--duration-base) var(--ease-standard)",
      transform: hovered && interactive ? "translateY(-2px)" : "none",
      borderColor: hovered && interactive ? "var(--blue-200)" : "var(--border-subtle)",
      cursor: interactive ? "pointer" : "default",
      ...extraStyle,
    };
    return h("div", { style: base, onMouseEnter: () => setHovered(true), onMouseLeave: () => setHovered(false), onClick }, children);
  }

  /* --- Button --- */
  function Button({ children, variant = "primary", onClick, style: extraStyle }) {
    const [hovered, setHovered] = useState(false);
    const variants = {
      primary: {
        background: hovered ? "var(--brand-strong)" : "var(--brand)",
        color: "var(--text-on-accent)",
        border: "1px solid transparent",
      },
      outline: {
        background: "transparent",
        color: hovered ? "var(--accent)" : "var(--text-body)",
        border: "1px solid var(--border-default)",
      },
      ghost: {
        background: hovered ? "var(--surface-raised)" : "transparent",
        color: "var(--text-body)",
        border: "none",
      },
    };
    return h("button", {
      onClick,
      onMouseEnter: () => setHovered(true),
      onMouseLeave: () => setHovered(false),
      style: {
        display: "inline-flex",
        alignItems: "center",
        gap: "var(--space-2)",
        fontFamily: "var(--font-sans)",
        fontSize: "var(--text-sm)",
        fontWeight: "var(--weight-medium)",
        padding: "8px 16px",
        borderRadius: "var(--radius-sm)",
        cursor: "pointer",
        transition: "background var(--duration-base) var(--ease-standard), color var(--duration-base) var(--ease-standard)",
        ...variants[variant] || variants.primary,
        ...extraStyle,
      },
    }, children);
  }

  /* --- PublicationItem --- */
  function PublicationItem({ title, authors = [], venue, year, badge, award, links = [] }) {
    const ownerName = "Watcharapong Wongkaew";
    return h("div", {
      style: {
        padding: "var(--space-4) 0",
        borderBottom: "1px solid var(--divider)",
      }
    },
      h("div", { style: { display: "flex", gap: "var(--space-3)", alignItems: "flex-start", marginBottom: 8 } },
        badge && h(Badge, { variant: "accent" }, badge),
        award && h(Badge, { variant: "coral" }, award),
      ),
      h("h3", {
        style: {
          fontFamily: "var(--font-display)",
          fontSize: "var(--text-md)",
          fontWeight: "var(--weight-medium)",
          color: "var(--text-strong)",
          margin: "0 0 6px",
          lineHeight: "var(--leading-snug)",
        }
      }, title),
      h("p", {
        style: {
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          color: "var(--text-muted)",
          margin: "0 0 8px",
        }
      },
        authors.map((a, i) =>
          h("span", { key: i },
            i > 0 && ", ",
            a === ownerName
              ? h("span", { style: { textDecoration: "underline", color: "var(--text-body)" } }, a)
              : a
          )
        )
      ),
      h("p", {
        style: {
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          color: "var(--text-faint)",
          margin: "0 0 10px",
        }
      }, venue),
      links.length > 0 && h("div", { style: { display: "flex", gap: "var(--space-2)", flexWrap: "wrap" } },
        links.map((l, i) =>
          h("a", {
            key: i,
            href: l.href || "#",
            style: {
              fontFamily: "var(--font-mono)",
              fontSize: "var(--text-xs)",
              color: "var(--accent)",
              border: "1px solid var(--border-default)",
              padding: "3px 10px",
              borderRadius: "var(--radius-xs)",
              textDecoration: "none",
              transition: "color var(--duration-fast), border-color var(--duration-fast)",
            }
          }, l.label)
        )
      )
    );
  }

  /* --- NewsItem --- */
  function NewsItem({ date, children }) {
    return h("div", {
      style: {
        display: "flex",
        gap: "var(--space-4)",
        padding: "var(--space-3) 0",
        borderBottom: "1px solid var(--divider)",
        alignItems: "flex-start",
      }
    },
      h("span", {
        style: {
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          color: "var(--text-faint)",
          minWidth: 72,

        style: {
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          color: "var(--text-body)",
          lineHeight: "var(--leading-normal)",
        }
      }, children)
    );
  }

  window.DS = { Avatar, Eyebrow, Badge, Card, Button, PublicationItem, NewsItem };
})();
</script>

/* ---- App root ---- */
function App() {
  const hashToPage = (h) => {
    const m = { "#about": "about", "#publications": "publications", "#projects": "projects", "#blog": "blog" };
    return m[h] || "about";
  };
  const [page, setPage] = React.useState(hashToPage(window.location.hash));

  React.useEffect(() => {
    const handler = () => setPage(hashToPage(window.location.hash));
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);

  function onNav(p) {
    setPage(p);
    window.location.hash = p;
  }

  const screens = {
    about: <AboutScreen />,
    publications: <PublicationsScreen />,
    projects: <ProjectsScreen />,
    blog: <BlogScreen />,
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <NavBar current={page} onNav={onNav} />
      <main style={{ flex: 1 }}>{screens[page]}</main>
      <SiteFooter />
    </div>
  );
}
